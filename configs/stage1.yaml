optimizer:
  betas: [0.9, 0.95]
  grad_clip_norm: 1.0
  learning_rate_schedule:
    - [0, 0.0001]
    - [15000, 0.00005]
    - [30000, 0.00001]
    - [45000, 0.000005]
train:
  batch_size: 1
  max_steps: 60000
  num_workers: 4
  seed: 2026
  log_interval: 20
  checkpoint_interval: 5000
  checkpoint_policy: best_lpips
