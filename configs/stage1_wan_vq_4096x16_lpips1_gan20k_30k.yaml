optimizer:
  learning_rate: 0.0001
  betas: [0.9, 0.99]
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  warmup_steps: 3000
  discriminator_learning_rate: 0.0001
  minimum_learning_rate_scale: 0.5
loss:
  pixel_weight: 1.0
  lpips_weight: 1.0
  codebook_weight: 1.0
  commitment_weight: 0.25
  gan_weight: 0.1
  gan_start_step: 20000
train:
  batch_size: 1
  gradient_accumulation: 8
  max_steps: 30000
  num_workers: 2
  seed: 2026
  log_interval: 10
  checkpoint_interval: 5000
