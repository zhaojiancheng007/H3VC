model:
  codebook_size: 4096
  codebook_dim: 16
  window_size: 8
  d_model: 384
  num_layers: 8
  num_heads: 6
  ffn_dim: 1024
  max_latent_frames: 9
optimizer:
  tokenizer_learning_rate: 0.000001
  entropy_learning_rate: 0.00001
  discriminator_learning_rate: 0.0001
  betas: [0.9, 0.95]
  grad_clip_norm: 1.0
loss:
  mse_weight: 1.0
  lpips_weight: 1.0
  commitment_weight: 0.25
  initial_rate_weight: 12.0
  base_rate_weight: 12.0
  final_rate_weight: 12.0
  rate_warmup_end_step: 1
  rate_ramp_start_step: 60000
  rate_ramp_end_step: 60001
  initial_temperature: 0.1
  final_temperature: 0.1
  gan_start_step: 60001
  gan_weight: 0.1
train:
  batch_size: 1
  max_steps: 80000
  num_workers: 2
  seed: 2026
  log_interval: 10
  checkpoint_interval: 5000
  bf16: true
