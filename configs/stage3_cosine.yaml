model:
  codebook_size: 4096
  codebook_dim: 24
  window_size: 8
  d_model: 384
  num_layers: 8
  num_heads: 6
  ffn_dim: 1024
  max_latent_frames: 32
optimizer:
  discriminator_learning_rate: 0.0001
  betas: [0.9, 0.95]
  grad_clip_norm: 1.0
  tokenizer_learning_rate: 0.00001
  tokenizer_eta_min: 0.0000005
  entropy_learning_rate: 0.00005
  entropy_eta_min: 0.000001
loss:
  mse_weight: 1.0
  lpips_weight: 1.0
  commitment_weight: 0.25
  rate_weight: 24.0
  temperature: 0.01
  gan_start_step: 20000
  gan_weight: 0.0
train:
  batch_size: 1
  max_steps: 60000
  num_workers: 4
  seed: 2026
  log_interval: 10
  checkpoint_interval: 5000
  bf16: true
