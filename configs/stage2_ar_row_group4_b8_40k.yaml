model:
  levels: [8, 8, 8, 5, 5, 5]
  rows_per_group: 4
  d_model: 384
  num_layers: 8
  num_heads: 6
  ffn_dim: 1024
  max_latent_frames: 9
  max_latent_height: 136
  max_latent_width: 240
optimizer:
  learning_rate: 0.00005
  betas: [0.9, 0.97]
  weight_decay: 0.05
  grad_clip_norm: 1.0
  warmup_steps: 2000
train:
  batch_size: 8
  gradient_accumulation: 1
  max_steps: 40000
  num_workers: 16
  seed: 2026
  log_interval: 20
  checkpoint_interval: 5000
  bf16: true
