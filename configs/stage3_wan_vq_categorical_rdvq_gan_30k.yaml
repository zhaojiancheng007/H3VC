model:
  codebook_size: 4096
  codebook_dim: 32
  window_size: 8
  d_model: 384
  num_layers: 8
  num_heads: 6
  ffn_dim: 1024
  max_latent_frames: 9
optimizer:
  tokenizer_learning_rate: 0.000001
  entropy_learning_rate: 0.00001
  discriminator_learning_rate: 0.0001
  betas: [0.9, 0.95]
  grad_clip_norm: 1.0
loss:
  mse_weight: 1.0
  lpips_weight: 0.1
  commitment_weight: 0.25
  initial_rate_weight: 1.2
  low_rate_weight: 4.8
  initial_temperature: 0.01
  low_rate_temperature: 0.1
  initial_warmup_steps: 2000
  low_rate_start_step: 20000
  low_rate_warmup_steps: 0
  gan_start_step: 15000
  gan_weight: 0.1
train:
  batch_size: 1
  gradient_accumulation: 8
  max_steps: 30000
  num_workers: 2
  seed: 2026
  log_interval: 10
  checkpoint_interval: 5000
