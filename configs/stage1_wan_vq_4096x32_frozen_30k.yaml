optimizer:
  projection_learning_rate: 0.0002
  codebook_learning_rate: 0.0001
  betas: [0.9, 0.95]
  projection_weight_decay: 0.0001
  grad_clip_norm: 1.0
  warmup_steps: 1000
loss:
  latent_weight: 1.0
  pixel_weight: 1.0
  lpips_weight: 0.1
  codebook_weight: 1.0
  commitment_weight: 0.25
train:
  batch_size: 1
  gradient_accumulation: 8
  max_steps: 30000
  num_workers: 2
  seed: 2026
  log_interval: 10
  checkpoint_interval: 5000
  kmeans_iterations: 10
  minimum_active_codes: 3072
