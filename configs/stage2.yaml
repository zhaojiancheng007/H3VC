model:
  codebook_size: 4096
  codebook_dim: 24
  window_size: 8
  d_model: 384
  num_layers: 8
  num_heads: 6
  ffn_dim: 1024
  max_latent_frames: 32
optimizer:
  betas: [0.9, 0.97]
  weight_decay: 0.05
  grad_clip_norm: 1.0
  learning_rate_schedule:
    - [0, 0.00005]
    - [15000, 0.00001]
    - [30000, 0.000005]
    - [45000, 0.000001]
train:
  batch_size: 4
  max_steps: 60000
  num_workers: 8
  seed: 2026
  log_interval: 20
  checkpoint_interval: 5000
  bf16: true
  checkpoint_policy: best_bpp
