model:
  levels: [8, 8, 8, 5, 5, 5]
  rows_per_group: 4
  d_model: 64
  num_layers: 2
  num_heads: 4
  ffn_dim: 128
  max_latent_frames: 9
  max_latent_height: 136
  max_latent_width: 240
optimizer:
  learning_rate: 0.00005
  betas: [0.9, 0.97]
  weight_decay: 0.05
  grad_clip_norm: 1.0
  warmup_steps: 10
train:
  batch_size: 1
  gradient_accumulation: 1
  max_steps: 10
  num_workers: 1
  seed: 2026
  log_interval: 1
  checkpoint_interval: 10
  bf16: true
